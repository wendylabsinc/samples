<!doctype html>
<html class="h-full bg-black overflow-hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YOLO26 Detection</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="h-full flex flex-col m-0 p-0 text-white font-sans overflow-hidden bg-black">
    <div class="fixed inset-0 z-0 flex items-center justify-center bg-black">
      <div id="video-container" class="relative max-w-full max-h-full w-full h-full flex items-center justify-center">
        <video
          id="video-stream"
          class="max-w-full max-h-full w-full h-full object-contain"
          autoplay
          playsinline
          muted
        ></video>
        <canvas id="detection-canvas" class="absolute top-0 left-0 w-full h-full pointer-events-none"></canvas>
      </div>
    </div>

    <!-- UI Overlay -->
    <div class="relative z-10 p-6 flex flex-col justify-between h-full pointer-events-none">
      <div class="flex justify-between items-start">
        <div class="pointer-events-auto">
          <img src="/logo.svg" alt="Wendy Logo" class="h-8 mb-2 drop-shadow-lg" />
          <h1 class="text-xl font-bold drop-shadow-md">YOLO26 Detection</h1>
          <div class="flex items-center gap-2 mt-1">
            <span id="status-dot" class="w-2 h-2 rounded-full bg-yellow-500 shadow-sm"></span>
            <span id="status-text" class="text-xs font-medium uppercase tracking-wider drop-shadow-md">Connecting...</span>
          </div>
        </div>

        <div class="flex flex-col items-end gap-2 pointer-events-auto">
          <select
            id="camera-select"
            class="bg-black/40 hover:bg-black/60 text-white text-xs px-3 py-2 rounded-lg backdrop-blur-sm border border-white/10 outline-none cursor-pointer appearance-none min-w-[160px]"
          >
            <option value="">Loading cameras...</option>
          </select>

          <button id="fullscreen-btn" class="bg-black/40 hover:bg-black/60 p-2 rounded-full backdrop-blur-sm transition-colors border border-white/10 group">
             <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="group-hover:scale-110 transition-transform"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          </button>
        </div>
      </div>

      <div class="flex items-end justify-between">
        <div class="pointer-events-auto bg-black/40 backdrop-blur-md p-3 rounded-lg border border-white/10 text-[10px] flex gap-4 uppercase tracking-widest text-white/70">
          <div><span class="font-bold text-white">FPS:</span> <span id="fps">0</span></div>
          <div><span class="font-bold text-white">Objects:</span> <span id="object-count">0</span></div>
          <div><span class="font-bold text-white">Model:</span> YOLO26n</div>
        </div>
      </div>
    </div>

    <div
      id="loading-overlay"
      class="fixed inset-0 z-20 flex items-center justify-center bg-black transition-opacity duration-500"
    >
      <div class="text-center">
        <div class="relative w-16 h-16 mx-auto mb-4">
            <div class="absolute inset-0 border-4 border-blue-500/20 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
        </div>
        <p class="text-gray-400 font-medium tracking-wide">LOADING YOLO26 MODEL</p>
      </div>
    </div>

    <script>
      const videoElement = document.getElementById("video-stream");
      const canvas = document.getElementById("detection-canvas");
      const ctx = canvas.getContext("2d");
      const loadingOverlay = document.getElementById("loading-overlay");
      const statusDot = document.getElementById("status-dot");
      const statusText = document.getElementById("status-text");
      const fpsDisplay = document.getElementById("fps");
      const objectCount = document.getElementById("object-count");
      const fullscreenBtn = document.getElementById("fullscreen-btn");
      const cameraSelect = document.getElementById("camera-select");

      let ws = null;
      let pc = null;
      let frameCount = 0;
      let lastFpsTime = performance.now();
      let latestDetections = [];

      // Color palette for different classes
      const classColors = {};
      const palette = [
        "#FF6B6B", "#4ECDC4", "#45B7D1", "#96CEB4", "#FFEAA7",
        "#DDA0DD", "#98D8C8", "#F7DC6F", "#BB8FCE", "#85C1E9",
        "#F8C471", "#82E0AA", "#F1948A", "#85929E", "#AED6F1",
      ];
      let colorIdx = 0;

      function getClassColor(cls) {
        if (!classColors[cls]) {
          classColors[cls] = palette[colorIdx % palette.length];
          colorIdx++;
        }
        return classColors[cls];
      }

      function setStatus(text, color) {
        statusDot.className = `w-2 h-2 rounded-full bg-${color}-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]`;
        statusText.textContent = text;
        statusText.className = `text-xs font-medium uppercase tracking-wider drop-shadow-md text-${color}-400`;
      }

      function drawDetections() {
        // Match canvas size to its CSS layout size
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (!videoElement.videoWidth || latestDetections.length === 0) {
          requestAnimationFrame(drawDetections);
          return;
        }

        // Compute the video's rendered position within the canvas (object-contain)
        const videoAspect = videoElement.videoWidth / videoElement.videoHeight;
        const canvasAspect = canvas.width / canvas.height;
        let renderW, renderH, offsetX, offsetY;

        if (videoAspect > canvasAspect) {
          renderW = canvas.width;
          renderH = canvas.width / videoAspect;
          offsetX = 0;
          offsetY = (canvas.height - renderH) / 2;
        } else {
          renderH = canvas.height;
          renderW = canvas.height * videoAspect;
          offsetX = (canvas.width - renderW) / 2;
          offsetY = 0;
        }

        for (const det of latestDetections) {
          const x = offsetX + det.x1 * renderW;
          const y = offsetY + det.y1 * renderH;
          const w = (det.x2 - det.x1) * renderW;
          const h = (det.y2 - det.y1) * renderH;
          const color = getClassColor(det.class);

          // Box
          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.strokeRect(x, y, w, h);

          // Label background
          const label = `${det.class} ${Math.round(det.confidence * 100)}%`;
          ctx.font = "bold 12px sans-serif";
          const textW = ctx.measureText(label).width;
          ctx.fillStyle = color;
          ctx.fillRect(x, y - 20, textW + 8, 20);

          // Label text
          ctx.fillStyle = "#000";
          ctx.fillText(label, x + 4, y - 6);
        }

        requestAnimationFrame(drawDetections);
      }

      function updateFps() {
        if (videoElement.requestVideoFrameCallback) {
            videoElement.requestVideoFrameCallback(() => {
                frameCount++;
                const now = performance.now();
                const elapsed = now - lastFpsTime;
                if (elapsed >= 1000) {
                    fpsDisplay.textContent = Math.round((frameCount * 1000) / elapsed);
                    frameCount = 0;
                    lastFpsTime = now;
                }
                updateFps();
            });
        } else {
            setTimeout(() => {
                frameCount++;
                const now = performance.now();
                if (now - lastFpsTime >= 1000) {
                    fpsDisplay.textContent = frameCount;
                    frameCount = 0;
                    lastFpsTime = now;
                }
                updateFps();
            }, 33);
        }
      }

      async function loadCameras() {
        try {
          const res = await fetch("/cameras");
          const cameras = await res.json();
          cameraSelect.innerHTML = "";
          if (cameras.length === 0) {
            cameraSelect.innerHTML = '<option value="">No cameras found</option>';
            return;
          }
          cameras.forEach((cam, i) => {
            const opt = document.createElement("option");
            opt.value = cam.id;
            opt.textContent = cam.name || `Camera ${i}`;
            cameraSelect.appendChild(opt);
          });
        } catch (e) {
          cameraSelect.innerHTML = '<option value="">Failed to load</option>';
        }
      }

      cameraSelect.addEventListener("change", () => {
        const deviceId = cameraSelect.value;
        if (deviceId && ws && ws.readyState === WebSocket.OPEN) {
          setStatus("Switching...", "yellow");
          ws.send(JSON.stringify({ switch_camera: deviceId }));
        }
      });

      function connect() {
        if (ws) ws.close();

        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(`${protocol}//${window.location.host}/stream`);

        ws.onopen = () => {
          setStatus("Negotiating", "yellow");
        };

        ws.onmessage = async (event) => {
          const msg = JSON.parse(event.data);

          if (msg.sdp) {
            if (msg.sdp.type === 'offer') {
                await handleOffer(msg.sdp);
            } else if (msg.sdp.type === 'answer') {
                await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
            }
          } else if (msg.ice) {
            if (pc) await pc.addIceCandidate(new RTCIceCandidate(msg.ice));
          } else if (msg.detections !== undefined) {
            latestDetections = msg.detections;
            objectCount.textContent = msg.detections.length;
          }
        };

        ws.onclose = () => {
          setStatus("Disconnected", "red");
          loadingOverlay.classList.remove("opacity-0");
          loadingOverlay.classList.remove("pointer-events-none");
          setTimeout(connect, 2000);
        };
      }

      async function handleOffer(offer) {
        if (pc) pc.close();

        pc = new RTCPeerConnection({
          iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        });

        pc.ontrack = (event) => {
          videoElement.srcObject = event.streams[0];
          loadingOverlay.classList.add("opacity-0");
          loadingOverlay.classList.add("pointer-events-none");
          setStatus("Live", "green");
        };

        pc.onicecandidate = (event) => {
          if (event.candidate) {
            ws.send(JSON.stringify({ ice: event.candidate }));
          }
        };

        await pc.setRemoteDescription(new RTCSessionDescription(offer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({ sdp: pc.localDescription }));
      }

      fullscreenBtn.onclick = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      };

      loadCameras();
      connect();
      updateFps();
      requestAnimationFrame(drawDetections);
    </script>
  </body>
</html>
